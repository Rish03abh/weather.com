<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Weather.com</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-image: url(Weather1.jpg);
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
      }
      .container {
        max-width: 600px;
        margin: 100px auto;
        padding: 40px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 10px;
      }
      .inputs {
        padding: 1rem 0;
        text-align: center;
      }
      .inputs input[type="text"] {
        height: 3rem;
        width: 20rem;
        font-weight: bold;
        font-size: 1rem;
        padding: 10px;
        border: 2px solid black;
        border-radius: 30px;
      }
      .inputs input[type="submit"] {
        height: 3rem;
        width: 6rem;
        background: rgb(0, 162, 255);
        font-weight: bold;
        color: white;
        font-size: 1rem;
        border-radius: 30px;
        border: none;
        cursor: pointer;
      }
      .display {
        text-align: center;
        width: 100%;
        margin-top: 20px;
      }
      .wrapper {
        padding: 20px;
        border-radius: 10px;
        background: white; /* Added white background */
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2); /* Added slight shadow */
      }
      .wrapper h2 {
        padding: 10px;
        color: black;
      }
      .wrapper p {
        font-size: 20px;
        color: black;
      }
      .wrapper span {
        color: rgb(7, 119, 7);
        font-size: 22px;
      }
      h1 {
        color: white;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Weather.com</h1>
      <section class="main">
        <section class="inputs">
          <input type="text" placeholder="Enter your city Name..." id="cityinput" />
          <input type="submit" value="Submit" id="add" />
        </section>

        <section class="display">
          <div class="wrapper">
            <h2 id="cityoutput"></h2>
            <p id="description"></p>
            <p id="temp"></p>
            <p id="wind"></p>
          </div>
        </section>
      </section>
    </div>

    <script>
      var inputvalue = document.querySelector("#cityinput");
      var btn = document.querySelector("#add");
      var cityoutput = document.querySelector("#cityoutput");
      var description = document.querySelector("#description");
      var temp = document.querySelector("#temp");
      var wind = document.querySelector("#wind");
      var apiKey = "4de5be02c2439750e1d74f052a120068";

      function convertTemperature(val) {
        return (val - 273.15).toFixed(1); // Fixed Kelvin to Celsius conversion
      }

      btn.addEventListener("click", function () {
        if (inputvalue.value.trim() === "") {
          alert("Please enter a city name.");
          return;
        }

        fetch(`https://api.openweathermap.org/data/2.5/weather?q=${inputvalue.value}&appid=${apiKey}`)
          .then((res) => res.json())
          .then((data) => {
            if (data.cod === "404") {
              alert("City not found. Please try again.");
              return;
            }

            var nameval = data.name;
            var weatherDesc = data.weather[0].description;
            var temperature = convertTemperature(data.main.temp);
            var windSpeed = data.wind.speed;

            cityoutput.innerHTML = `Weather of <span>${nameval}</span>`;
            temp.innerHTML = `Temperature: <span>${temperature} °C</span>`;
            description.innerHTML = `Sky conditions: <span>${weatherDesc}</span>`;
            wind.innerHTML = `Wind speed: <span>${windSpeed} km/h</span>`;
          })
          .catch((err) => alert("An error occurred. Please try again."));
      });
    </script>
  </body>
</html>
